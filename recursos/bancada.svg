<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Bancada: un chip sobre la máscara verde de una placa. La señal de prueba entra por una
       pista de cobre, atraviesa el chip como un pulso de diagnóstico y sale por el otro lado. -->
  <defs>
    <linearGradient id="placa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5E47"/>
      <stop offset="1" stop-color="#0A3024"/>
    </linearGradient>
    <linearGradient id="cobre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0B27A"/>
      <stop offset="1" stop-color="#C46E34"/>
    </linearGradient>
    <clipPath id="dentro"><rect x="68" y="68" width="120" height="120" rx="22"/></clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#placa)"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Pistas finas de fondo -->
  <g stroke="#D99055" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M100 52 V30 M128 52 V24 M156 52 V30 M100 204 V226 M128 204 V232 M156 204 V226"/>
  </g>

  <!-- Patas del chip -->
  <g stroke="url(#cobre)" stroke-width="11" stroke-linecap="round">
    <path d="M100 66 V52 M128 66 V52 M156 66 V52 M100 190 V204 M128 190 V204 M156 190 V204"/>
    <path d="M66 98 H52 M66 158 H52 M190 98 H204 M190 158 H204"/>
  </g>

  <!-- Cuerpo del chip -->
  <rect x="68" y="68" width="120" height="120" rx="22" fill="url(#cobre)"/>
  <rect x="68" y="68" width="120" height="120" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="90" cy="90" r="5" fill="#0F3D2E" fill-opacity="0.35"/>

  <!-- La señal: cobre sobre la placa, verde sobre el chip -->
  <path id="senal" d="M34 128 H88 L104 106 L124 160 L142 96 L158 128 H222"
        fill="none" stroke="url(#cobre)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 128 H88 L104 106 L124 160 L142 96 L158 128 H222" clip-path="url(#dentro)"
        fill="none" stroke="#0F3D2E" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vías en los extremos -->
  <circle cx="34" cy="128" r="13" fill="#E8A26A"/><circle cx="34" cy="128" r="5.5" fill="#0C3427"/>
  <circle cx="222" cy="128" r="13" fill="#E8A26A"/><circle cx="222" cy="128" r="5.5" fill="#0C3427"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
